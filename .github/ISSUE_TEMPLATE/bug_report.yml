name: Bug report / 问题报告
description: Report a reproducible skill, CLI, or docs problem. / 报告可复现的技能、CLI 或文档问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Share a minimal public or synthetic reproducer; no private logs/data, runtime state, or credentials. / 提供最小公开或合成复现，不包含私人日志或数据、运行状态或凭据。"
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior / 预期与实际行为
      description: "Name the requirement and affected layer (protocol, runner, verifier). Report status and assurance separately for formal checks. / 说明对应需求与层次（协议、runner、verifier）；形式检查的 status 与 assurance 分开记录。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction / 最小复现
      description: "Include commands, sanitized inputs, and output/error; link the passage for a docs issue. Formal declarations follow the selected adapter schema; kind/statement/quantity/domain are scalar-contract fields, not universal multidimensional fields. / 提供命令、脱敏输入与输出或错误；文档问题可链接原文。形式声明遵循所选 adapter 的 schema；kind/statement/quantity/domain 属于标量契约，不向所有多维 spec 强加。"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment / 版本与环境
      description: "Include RDS version/commit/ref, adapter/backend and version if applicable, OS, Python, and relevant dependencies. Say whether this is main, a PR, or a development candidate. / 提供 RDS 版本/commit/ref、适用的 adapter/backend 与版本、系统、Python 和依赖，并区分 main、PR 或开发候选。"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Evidence and impact / 证据与影响
      description: "Note impact or workaround, and distinguish admission, execution, and scientific evidence. FAIL or UNKNOWN is not a general scientific refutation. / 说明影响或临时方案，区分准入、执行与科学证据；FAIL 或 UNKNOWN 不是一般性的科学反驳。"
