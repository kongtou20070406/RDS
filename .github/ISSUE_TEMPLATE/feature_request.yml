name: Feature or research case / 功能或研究案例
description: Propose a focused capability, rule, docs change, or case. / 提议聚焦的功能、规则、文档改进或案例。
title: "[Proposal] "
body:
  - type: markdown
    attributes:
      value: "Use public references and sanitized examples; separate proposed evidence from established results. / 使用公开引用与脱敏示例，区分待验证证据与已有结果。"
  - type: textarea
    id: problem
    attributes:
      label: Decision or problem / 决策或问题
      description: "What needs improvement? Name the layer: protocol, runner, verifier, or experimental L4 tool. L1–L4 are responsibilities, not executable states. / 哪项工作需要改进？说明协议、runner、verifier 或实验性 L4 工具层次；L1–L4 是职责，不是程序状态。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and scope / 改动与范围
      description: "Name the base RDS version/ref and adapter/backend; separate released support, this proposal, and development candidates. State the exact claim and follow the selected adapter schema; kind/statement/quantity/domain are scalar-contract fields, not universal multidimensional fields. / 说明基础版本/ref 与 adapter/backend，区分已发布支持、本提案和开发候选。精确命题遵循所选 adapter 的 schema；kind/statement/quantity/domain 属于标量契约，不向所有多维 spec 强加。"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and validation / 证据与验证
      description: "Link dated original sources or a minimal public reproducer. Give a discriminating check and expected status/assurance separately. Label synthetic regression, replay, or independent evaluation; an L4 improvement claim needs independent equal-total-cost research trajectories. / 提供注明日期的原始来源或最小公开复现，说明区分性检查，分别列出预期 status 与 assurance。标明合成回归、回放或独立评估；L4 提升声明需独立、等总成本的科研轨迹。"
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Cost and compatibility / 成本与兼容性
      description: "Note dependencies, budget, command/schema changes, and affected translations. / 说明依赖、预算、命令或 schema 改动及受影响的译文。"
