<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Research Direction Selector</title>
  <desc id="desc">Better questions. Decisive experiments. Choose, experiment, verify, evolve. A luminous geometric research core surrounded by intersecting experimental trajectories.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080f1d"/><stop offset="1" stop-color="#11152b"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f4fcff"/><stop offset="0.5" stop-color="#d0f7ff"/><stop offset="1" stop-color="#c9b6ff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#59e9eb" stop-opacity="0.05"/><stop offset="0.45" stop-color="#59e9eb"/><stop offset="1" stop-color="#beabff" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#76f6f0"/><stop offset="1" stop-color="#b49bff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#4ca7c6" stop-opacity="0.23"/><stop offset="0.5" stop-color="#6762ae" stop-opacity="0.11"/><stop offset="1" stop-color="#6762ae" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#91b3cd" stroke-opacity="0.075" stroke-width="0.7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="418" rx="24"/></clipPath>
  </defs>
