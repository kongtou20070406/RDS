      <text x="60" y="217" fill="url(#title-fill)" font-size="124" font-weight="750" letter-spacing="-7">RDS</text>
      <text x="68" y="273" fill="#253b54" font-size="28" font-weight="400" letter-spacing="-0.45">Better questions. Decisive experiments.</text>
      <text x="68" y="355" fill="#556780" font-size="12" font-weight="600" letter-spacing="1.9">CHOOSE  /  EXPERIMENT  /  VERIFY  /  EVOLVE</text>
