    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse cx="934" cy="205" rx="299" ry="259" fill="url(#halo)"/>
    <path d="M0 419H1200M1199 0V420" fill="none" stroke="#8063aa" stroke-opacity="0.09"/>
    <path d="M68 55H116" stroke="#008f9a" stroke-width="3" stroke-linecap="round"/>
    <path d="M124 55H140" stroke="#8b74be" stroke-width="3" stroke-linecap="round"/>
