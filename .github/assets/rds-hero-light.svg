<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RDS — Research Direction Selector</title>
  <desc id="desc">Better questions. Decisive experiments. Choose, experiment, verify, evolve. A geometric research core surrounded by intersecting experimental trajectories.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fcff"/><stop offset="1" stop-color="#eef0fc"/>
    </linearGradient>
    <linearGradient id="title-fill" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#102d45"/><stop offset="0.5" stop-color="#154b62"/><stop offset="1" stop-color="#5e4c8e"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#008c9a" stop-opacity="0.08"/><stop offset="0.45" stop-color="#008c9a"/><stop offset="1" stop-color="#8270ba" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#008e9c"/><stop offset="1" stop-color="#8364ba"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#4ebac5" stop-opacity="0.18"/><stop offset="0.5" stop-color="#9b94d3" stop-opacity="0.11"/><stop offset="1" stop-color="#9b94d3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#627ba0" stroke-opacity="0.08" stroke-width="0.7"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="418" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
