name: Auto merge PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr?.node_id) {
              core.setFailed('Missing pull request node ID.');
              return;
            }
            try {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: SQUASH}) {
                    pullRequest {
                      number
                    }
                  }
                }`,
                { pullRequestId: pr.node_id }
              );
              core.info(`Enabled auto-merge for #${pr.number}.`);
            } catch (error) {
              if (/already enabled/i.test(String(error.message))) {
                core.info(`Auto-merge already enabled for #${pr.number}.`);
                return;
              }
              throw error;
            }
