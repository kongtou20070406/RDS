name: RDS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-formal.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B benchmark/run.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          axiom-audit: 'true'
          axiom-audit-root: Formal
      - run: python -B -m unittest discover -s tests -p 'test_rds_lean*.py' -v
      - run: python -B -m unittest discover -s tests -p 'test_rds_statistical_obligations.py' -v
