<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">RDS：研究判断与参考执行的职责边界</title>
  <desc id="desc">研究者确定目标和预算，Codex 结合当前证据、Obelisk 历史和判断规则声明实验。受限标量参考内核与项目自己的真实训练器分别执行，结果回到下一次决策。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#89938b" stroke-width="1.5"/></marker>
    <style>text{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}.title{font-size:30px;font-weight:650;fill:#182b24}.heading{font-size:20px;font-weight:600;fill:#182b24}.body{font-size:16px;fill:#54625b}.eyebrow{font-size:13px;letter-spacing:2px;fill:#897050}.box{fill:#fff;stroke:#d8dfd6;stroke-width:1.5}.path{fill:none;stroke:#89938b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="700" rx="22" fill="#f5f6ef"/>
  <text x="50" y="48" class="eyebrow">RESEARCH DIRECTION SELECTOR</text>
  <text x="50" y="90" class="title">目标 → 可区分的实验 → 原始证据 → 下一步</text>
  <text x="50" y="122" class="body">同一套决策纪律，两条不同的执行路径。</text>
  <rect x="50" y="170" width="270" height="125" rx="16" class="box"/>
  <text x="74" y="204" class="heading">研究者与原始证据</text>
  <text x="74" y="236" class="body">目标 · 公平基线 · 授权预算</text>
  <text x="74" y="264" class="body">当前代码 / 日志 / 论文</text>
  <rect x="50" y="333" width="270" height="125" rx="16" class="box"/>
  <text x="74" y="368" class="heading">已有历史与判断规则</text>
  <text x="74" y="400" class="body">Obelisk 有界原文检索</text>
  <text x="74" y="428" class="body">规则的范围 / 反例 / 证伪条件</text>
  <rect x="390" y="218" width="350" height="205" rx="18" fill="#18382c"/>
  <text x="416" y="255" font-size="22" font-weight="600" fill="#fff">Codex + RDS 技能</text>
  <text x="416" y="291" font-size="17" fill="#d9e7d4">明确竞争解释与不同预测</text>
  <text x="416" y="323" font-size="17" fill="#d9e7d4">声明操作检查与公平比较</text>
  <text x="416" y="355" font-size="17" fill="#d9e7d4">预先固定预算与停止条件</text>
  <text x="416" y="387" font-size="17" fill="#d9e7d4">推荐一条能改变决策的路线</text>
  <path d="M320 232H350V288H384" class="path"/>
  <path d="M320 395H350V354H384" class="path"/>
  <rect x="810" y="170" width="340" height="146" rx="16" class="box"/>
  <text x="834" y="204" class="heading">本地参考内核</text>
  <text x="834" y="236" class="body">AST / 可选标量符号探针</text>
  <text x="834" y="264" class="body">SQLite 门禁、预算与哈希收据</text>
  <text x="834" y="293" font-size="14" fill="#a25a34">仅受限标量程序 + 配对 MSE</text>
  <rect x="810" y="354" width="340" height="146" rx="16" class="box"/>
  <text x="834" y="389" class="heading">研究项目自己的训练器</text>
  <text x="834" y="421" class="body">真实数据与 PyTorch / GPU 实验</text>
  <text x="834" y="449" class="body">原始产物、公平比较与独立评估</text>
  <text x="834" y="478" font-size="14" fill="#a25a34">RDS CLI 不执行或认证此路径</text>
  <path d="M740 278H775V244H804" class="path"/>
  <path d="M740 369H775V427H804" class="path"/>
  <rect x="390" y="553" width="760" height="95" rx="16" class="box"/>
  <text x="416" y="587" class="heading">分别判断：任务收益 · 机制解释 · 搜索策略 · 执行状态</text>
  <text x="416" y="620" class="body">Advisor 提供待验证的建议；反思与规则修订仍需来源审阅和回归。</text>
  <path d="M980 316V339H1171V533H1010V547" class="path"/>
  <path d="M980 500V547" class="path"/>
  <path d="M390 602H360V321H384" class="path"/>
  <text x="70" y="575" class="body">结果改变下一次决策</text>
  <text x="70" y="604" font-size="14" fill="#897050">没有自动提升证据等级</text>
</svg>
