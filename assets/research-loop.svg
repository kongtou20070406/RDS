<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">RDS 可审阅的研究闭环</title>
  <desc id="desc">目标契约、竞争解释、操作检查、预算和数据门禁、执行收据以及分开的证据判断形成闭环。失败可以触发显式分叉和候选规则反思，但不会自动证伪科学假说或自动修复代码。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#89938b" stroke-width="1.5"/></marker>
    <style>text{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif}.heading{font-size:19px;font-weight:600;fill:#182b24}.body{font-size:15px;fill:#54625b}.number{font-size:13px;letter-spacing:2px;fill:#a25a34}.box{fill:#fff;stroke:#d8dfd6;stroke-width:1.5}.path{fill:none;stroke:#89938b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="610" rx="22" fill="#f5f6ef"/>
  <text x="50" y="48" class="number">A REVIEWABLE RESEARCH LOOP</text>
  <text x="50" y="90" font-size="30" font-weight="650" fill="#182b24">每一步都留下下一步能够检查的东西</text>
  <text x="50" y="124" class="body">先决定如何解释结果，再看结果；把没有回答的问题留在记录里。</text>
  <rect x="50" y="175" width="330" height="130" rx="16" class="box"/>
  <text x="74" y="203" class="number">01 / CONTRACT</text>
  <text x="74" y="234" class="heading">锁定目标与比较契约</text>
  <text x="74" y="265" class="body">主指标 · 基线 · 数据角色 · 预算</text>
  <rect x="435" y="175" width="330" height="130" rx="16" class="box"/>
  <text x="459" y="203" class="number">02 / HYPOTHESIS</text>
  <text x="459" y="234" class="heading">声明竞争解释与证伪条件</text>
  <text x="459" y="265" class="body">不同预测 · 区分属性 · 后续决策</text>
  <rect x="820" y="175" width="330" height="130" rx="16" class="box"/>
  <text x="844" y="203" class="number">03 / ADMISSION</text>
  <text x="844" y="234" class="heading">检查操作、数据与资源</text>
  <text x="844" y="265" class="body">检查不预留；创建计划原子预留</text>
  <path d="M380 240H429" class="path"/>
  <path d="M765 240H814" class="path"/>
  <rect x="820" y="355" width="330" height="130" rx="16" class="box"/>
  <text x="844" y="383" class="number">04 / EXECUTION</text>
  <text x="844" y="414" class="heading">执行并保存收据与产物</text>
  <text x="844" y="445" class="body">启动计费 · 数据暴露 · 对照复用</text>
  <rect x="435" y="355" width="330" height="130" rx="16" fill="#18382c"/>
  <text x="459" y="383" font-size="13" letter-spacing="2" fill="#b5d18c">05 / ASSESSMENT</text>
  <text x="459" y="414" font-size="19" font-weight="600" fill="#fff">按命题判断证据</text>
  <text x="459" y="445" font-size="15" fill="#d9e7d4">收益 ≠ 机制 ≠ 搜索策略 ≠ 执行</text>
  <rect x="50" y="355" width="330" height="130" rx="16" class="box"/>
  <text x="74" y="383" class="number">06 / NEXT DECISION</text>
  <text x="74" y="414" class="heading">继续、停止或显式分叉</text>
  <text x="74" y="445" class="body">反思候选规则 · 来源审阅 · 回归</text>
  <path d="M985 305V349" class="path"/>
  <path d="M820 420H771" class="path"/>
  <path d="M435 420H386" class="path"/>
  <path d="M215 355V311" class="path"/>
  <text x="50" y="540" class="body">参考内核的机制探针可以检查操作及类型化反例；通过门禁本身不证明因果机制。</text>
  <text x="50" y="569" class="body">停滞和规则反思是可审阅的辅助流程，当前 SQLite 项目尚未贯通自动修复。</text>
</svg>
