      "id": "preserve-quantifiers",
      "scope": "NSI case and analogous quantified claims",
      "trigger": "failure of one fixed action is used to dismiss every input-conditional policy",
      "correction": "failure of a fixed a for all f does not disprove existence of g(f) for all f",
      "alternatives": [
        "no fixed action works",
        "no learnable conditional policy works"
      ],
      "discriminator": "compare fixed action, per-example oracle bound, and policy using deployment-visible f on a held-out set",
      "primary_gate": "formal held-out task metric for the learned conditional policy",
      "falsifier": "failure of a tested g narrows that policy class; it does not disprove all g",
      "sources": [
        "NSI 2026-07-29 original experiment and user correction; retrieve via Obelisk when needed"
      ],
      "proof_obligations": {
        "schema": 1,
        "preconditions": [
          "State each quantifier, policy class and available information.",
          "Distinguish a fixed action, an oracle and a learned conditional policy."
        ],
        "feasible_domain": {
          "expression": "not(forall f, P(a0,f)) does_not_imply not(exists g in G_deploy, forall f, P(g(f),f))",
          "variables": "a0: one tested fixed action; f: deployment-visible input; P: stated success predicate; G_deploy: declared learnable policy class using deployment inputs",
          "assumptions": [
            "Use the node scope and bind declared inputs to original artifacts.",
            "These are documentation predicates; no automatic parser or proof is implied."
          ]
        },
        "falsifier": "A failing tested action or policy is generalized to all conditional policies without evidence covering the quantified class.",
        "evidence_requirements": [
          "compare fixed action, per-example oracle bound, and policy using deployment-visible f on a held-out set",
          "formal held-out task metric for the learned conditional policy",
          "Preserve original source identities, versions and actual outputs; do not substitute self-signed success fields."
        ],
        "verification": {
          "mode": "logic_and_empirical",
