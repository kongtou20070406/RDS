  - id: hard-budget-reallocation
    scope: finite campaign allocation / Sep14 48-hour example
    trigger: a weak early rank motivates extending selected arms while an existing queue already consumes the authorized total cap
    correction: a useful extension spends the remaining campaign budget; queued allocations are not free and must be cancelled or deferred before replacing them
    alternatives:
      - reallocation can resolve a low-fidelity ranking within the cap
      - an extension cannot fit the measured remaining budget
      - the early rank is sufficient for the next local decision
    discriminator: account for spent and reserved work; derive scheduled wall time from per-arm step times, step counts and feasible concurrency, including data and evaluation overhead and contingency; cost a matched pair and explicitly release displaced allocations before admission
    primary_gate: expected decision-changing primary-metric evidence within the authorized total cap and protected confirmation reserve
    falsifier: if the measured remaining budget cannot fit the comparison, reduce the plan or seek a new budget decision; a promising outcome never retroactively authorizes an overrun
    sources:
      - "benchmark/manifest.json — sep14-48h-budget provenance and packet hashes"
      - "benchmark/prompts/sep14-48h-budget.md"
      - "benchmark/sealed/sep14-48h-budget.md"
