      - "codex:01a07a03-acf7-7fd1-b823-afdd157db056:002957"

  - id: implementation-equivalence-before-speedup
    scope: accelerated implementation within a scientific comparison / Sep14 example
    trigger: a faster implementation is introduced alongside a longer-budget comparison and the resulting score change is attributed only to the scientific method or training length
    correction: execution speed and numerical equivalence are distinct claims; a changed computation can alter the experiment even when the interface and parameter count match
    alternatives:
      - equivalent implementation permits more affordable evidence
      - numerical or gradient drift changes model behavior
    discriminator: compare forward outputs and relevant gradients with the original implementation on representative inputs under a declared tolerance, retain version hashes, and use one verified implementation protocol for the matched arms
    primary_gate: equivalence checks within their declared input and tolerance scope, then primary quality and actual resource use under the recorded protocol
    falsifier: if output or gradient checks fail or omit the altered route, treat the accelerated code as a distinct implementation and do not credit all later differences to budget alone
    sources:
      - "benchmark/manifest.json — sep14-48h-budget provenance and packet hashes"
      - "benchmark/prompts/sep14-48h-budget.md"
      - "benchmark/sealed/sep14-48h-budget.md"
      - "codex:01a07a03-acf7-7fd1-b823-afdd157db056:002579"
      - "codex:01a07a03-acf7-7fd1-b823-afdd157db056:002630"

  - id: source-aware-evaluator-check
    scope: proposal judging and self-repair / C7 source-aware audit
    trigger: a high proposal or judge score is used as evidence that the proposed intervention discriminates the scientific claim
    correction: a judge can reward a plausible intervention while missing the executed equation; agreement or rubric scores cannot replace source-aware manipulation checks
    alternatives:
      - high-scoring proposal is scientifically discriminating
      - proposal and judge share an omitted premise
      - rubric measures protocol fluency rather than causal validity
    discriminator: provide an independent auditor the declared claim, executed equation and intervention manifest; derive the reachable property without the sealed later outcome, and preserve original scores alongside any correction
    primary_gate: reproducible source-grounded validity of the discriminator before a score is used to justify mechanism inference or an expensive launch
    falsifier: if the claimed distinction disappears under the executed equation, revise the proposal or narrow its scope; a repair on this known case is not evidence of general evaluator reliability
    sources:
      - "benchmark/prompts/sep13-c7-boundary.md"
      - "benchmark/sealed/sep13-c7-boundary.md — source-aware intervention audit"
      - "benchmark/rubric.json — sep13-c7-boundary"
