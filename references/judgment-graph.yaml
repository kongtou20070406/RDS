  - id: short-budget-fidelity
    scope: conditional; train-curve and schedule dependent
    trigger: short-run ordering is used to select a full-budget architecture
    correction: short-run rank is an unvalidated surrogate until checked against formal endpoints; equal steps need not imply equal sample-work or comparable convergence when batch size and schedule differ
    alternatives: [early rank predicts endpoint, schedules or fast starters reverse rank]
    discriminator: compare early and longer matched-budget ranks on representative candidates; account for steps times batch size, schedule and implementation changes, and report rank correlation or top-choice retention only when enough candidates were measured
    primary_gate: full-budget formal endpoint under the same recipe
    falsifier: if ranks reverse, short runs serve only as feasibility diagnostics for this setting
    sources:
      - "NSI 2026-08-01 5k/15k/30k versus 60k case; retrieve original logs through Obelisk"
      - "https://arxiv.org/abs/1905.04753"
      - "benchmark/prompts/sep14-48h-budget.md"
      - "benchmark/sealed/sep14-48h-budget.md"
      - "codex:01a07a03-acf7-7fd1-b823-afdd157db056:002233"
      - "codex:01a07a03-acf7-7fd1-b823-afdd157db056:002957"

  - id: method-recipe-variance
    scope: general
    trigger: one method implementation or seed beats a baseline with different recipe or tuning effort
    correction: implementation, recipe, and stochastic variation can reverse a nominal method ranking
    alternatives: [method effect, recipe or implementation effect]
    discriminator: matched budget and tuning rules, paired seeds, then independent implementations when decisions hinge on a small gain
    primary_gate: formal test metric with spread or uncertainty under fair comparison
    falsifier: if gain is explained by recipe or vanishes across implementations, do not credit method
    sources:
      - "https://openaccess.thecvf.com/content_CVPR_2019/html/He_Bag_of_Tricks_for_Image_Classification_with_Convolutional_Neural_Networks_CVPR_2019_paper.html"
      - "https://arxiv.org/abs/2607.26587"

  - id: realized-boundary-not-knob
    executable: {"decisions":["mechanism-attribution","strict-boundary-test"],"preconditions":[{"fact":"strict_subunit_claim","op":"eq","value":true,"query":"Read the claim: is strict realized mass below one, rather than a safety margin, being tested?"},{"fact":"executed_equation_family","op":"eq","value":"nsi-row-normalization","query":"Read the executed versioned equation; do not identify this family from generic m<1 text."},{"fact":"strict_crossing_feasible","op":"eq","value":true,"query":"Read the attainable-range derivation for this executed equation, domain and rho. Can this arm realize m>=1?","on_false":{"id":"narrow-boundary-interpretation","kind":"INTERPRETATION_UPDATE","description":"Narrow the current interpretation to the tested margin/engineering effect and read actual crossing logs. A rho=1 knob change is not a strict crossing when the sourced executed equation/range remains m<1.","competing_explanations":["executed equation/range excludes crossing","log or equation belongs to another version"],"required_observables":["executed equation/version","attainable range/source","actual mass/crossing log"],"outcomes":[{"observation":"range and actual log agree that no crossing occurred","next_decision":"retain margin comparison only; mechanism remains untested"},{"observation":"actual log contradicts the declared equation/range","next_decision":"reconcile implementation and range before another mechanism test"}],"stop_condition":"Reuse existing artifacts first; stop on invalid prerequisites or the declared budget cap."}}],"satisfied_when":[{"fact":"actual_boundary_crossing","op":"eq","value":true,"query":"Read actual per-sample mass and crossing counts for the exact executed arm.","on_false":{"id":"narrow-boundary-interpretation","kind":"INTERPRETATION_UPDATE","description":"Narrow the current interpretation to the tested margin/engineering effect and read actual crossing logs. A rho=1 knob change is not a strict crossing when the sourced executed equation/range remains m<1.","competing_explanations":["executed equation/range excludes crossing","log or equation belongs to another version"],"required_observables":["executed equation/version","attainable range/source","actual mass/crossing log"],"outcomes":[{"observation":"range and actual log agree that no crossing occurred","next_decision":"retain margin comparison only; mechanism remains untested"},{"observation":"actual log contradicts the declared equation/range","next_decision":"reconcile implementation and range before another mechanism test"}],"stop_condition":"Reuse existing artifacts first; stop on invalid prerequisites or the declared budget cap."}}],"action":{"id":"inspect-actual-boundary-crossings","kind":"READ_ONLY_CHECK","description":"Reuse source and crossing logs; verify actual strict-boundary manipulation before a task comparison.","competing_explanations":["threshold actually crossed","only a cap/margin changed and masses remain subunit"],"required_observables":["executed equation","declared domain","attainable range","actual crossing counts"],"outcomes":[{"observation":"crossing observed in declared domain","next_decision":"consider matched boundary task comparison"},{"observation":"crossing absent","next_decision":"retain margin comparison only"}],"stop_condition":"Reuse existing artifacts first; stop on invalid prerequisites or the declared budget cap."}}
    scope: NSI-style row normalization a_i = rho * raw_i / (1 + sum_j abs(raw_j)); recompute for any changed implementation
    trigger: a change of the rho parameter is claimed to test whether actual row mass below one is necessary
    correction: actual mass m = rho * S / (1 + S), S = sum_j abs(raw_j); for finite S and rho = 1, m is still strictly below one
    alternatives: [a tighter 0.95 safety margin helps, strict subunit mass is necessary, ordinary amplitude control or optimization explains the result]
    discriminator: to test the strict subunit predicate, use a normalized comparator that can realize m at or above one, measure actual crossings, and match starting operator and training as closely as feasible; a 0.95 versus 1.00 cap tests only the margin; for rho > 1 the original formula crosses only when S >= 1 / (rho - 1)
    primary_gate: matched restoration metric and budget; separate any task gain from the narrower mechanism conclusion
    falsifier: if the executed operator differs from this formula, recalculate its attainable mass; if no actual crossing occurs, withdraw any strict-bound inference
    sources:
      - "benchmark/prompts/sep13-c7-boundary.md"
      - "benchmark/sealed/sep13-c7-boundary.md — source-aware intervention audit"
      - "codex:01a03d28-4c3b-70a0-94f0-d4396cde19b6:000244"

  - id: depth-versus-trajectory
    scope: NSI case and analogous recurrent models
    trigger: independently trained K-step models are used to assert that one model degrades at later steps
    correction: cross-model depth comparison is not a within-checkpoint trajectory
    alternatives: [same model worsens at later steps, separately trained deep model performs worse]
    discriminator: evaluate intermediate steps from one fixed checkpoint on the same images
    primary_gate: fixed-checkpoint stepwise formal metric with compute cost
    falsifier: without fixed-checkpoint trajectory, withhold trajectory claims
    sources: ["NSI 2026-09-27 experiment audit; retrieve original checkpoint records through Obelisk"]

  - id: reuse-baseline-control
    executable: {"decisions":["allocate-control-compute"],"preconditions":[{"fact":"plan_reruns_baseline","op":"eq","value":true,"query":"Read the pending plan: is it allocating a repeated blank control?"},{"fact":"baseline_cache_available","op":"eq","value":true,"query":"Read cache keys and per-sample artifacts without running the baseline."}],"satisfied_when":[{"fact":"baseline_identity_exact","op":"eq","value":true,"query":"Compare control AST/data bytes; stochastic/trained extensions also require seed/checkpoint/recipe/numerical identity."},{"fact":"successful_origin_receipt","op":"eq","value":true,"query":"Read the original successful receipt and bind its cached sample outputs."}],"action":{"id":"verify-control-cache-identity","kind":"READ_ONLY_CHECK","description":"Inspect existing cache identity and receipt. Matching signature/metric label is insufficient; a cache hit does not restore confirmation eligibility.","competing_explanations":["identical cached computation","code/data/seed/recipe or origin differ"],"required_observables":["full control identity","data SHA256","sample outputs","original receipt"],"outcomes":[{"observation":"identity and successful origin match","next_decision":"reuse cached control; pay incremental treatment cost"},{"observation":"identity or origin differs","next_decision":"invalidate cache candidate; cost necessary fresh control"}],"stop_condition":"Reuse existing artifacts first; stop on invalid prerequisites or the declared budget cap."}}
    scope: deterministic reference adapter / compute-allocation; extend identity for stochastic or learned controls
    trigger: an experiment plan proposes re-running the blank baseline control on a dataset partition where an identical baseline was already evaluated
    correction: reuse a verified identical control evaluation across treatments; the current rational adapter is deterministic and keys the cache by locked control AST and dataset bytes, while stochastic or learned controls also require seed, checkpoint, recipe and any result-affecting execution settings
    alternatives: [fresh rerun needed due to code/data/seed drift, redundant rerun of identical baseline]
    discriminator: verify control identity and dataset SHA-256 against the original receipt; for an extended adapter verify its full stochastic and numerical identity before reuse; host changes are harmless only when they cannot change the declared control result
    primary_gate: cached per-sample control outputs must bind the locked baseline and exact dataset partition; a cache hit does not restore an exposed partition's confirmation eligibility
    falsifier: invalidate reuse if baseline computation, data, or result-affecting stochastic or numerical conditions changed, or if cached observations cannot be traced to a successful receipt
    sources:
      - "scripts/rds_cli.py — cmd_run baseline_key and BASELINE_CACHED receipt"
      - "scripts/rds_probe.py — restricted deterministic rational AST"
      - "benchmark/prompts/sep13-c7-boundary.md — no-repeat research instruction"
      - "codex:01a07a03-acf7-7fd1-b823-afdd157db056:001512"

  - id: trained-anchor-not-method-win
    scope: first feasible benchmark run / July08 EqOp example
    trigger: a first completed trained model or an old single score is used to claim superiority over an unmatched method
    correction: a feasible trained anchor establishes executable training and a measured endpoint; comparative superiority requires an appropriate matched control
    alternatives:
      - feasible implementation with unknown comparative utility
      - reproducible gain over a matched baseline
    discriminator: record the anchor's recipe, resource use and per-example endpoint; compare a mixer-only replacement with the baseline under the same carrier, data, selection and evaluation rules
    primary_gate: the project's primary task metric against the matched baseline at the declared quality-resource budget
    falsifier: if only the anchor completed, retain the feasibility conclusion and withhold the comparative win; an unfavorable matched result narrows the tested recipe rather than every future operator
    sources:
      - "benchmark/manifest.json — july08-baseline provenance and packet hashes"
      - "benchmark/prompts/july08-baseline.md"
      - "benchmark/sealed/july08-baseline.md"
      - "1c33f31f-a6bf-4ed2-adaf-3dff4e46c882"
      - "8475a3e9-b8da-449e-87ab-6e806e421832"

  - id: resource-canary-before-campaign
    scope: resource-constrained training / July08 and Aug30 examples
    trigger: architecture size or a multi-arm campaign is chosen from nominal capacity without measuring the actual run configuration
    correction: parameter counts and GPU availability alone do not establish memory fit or affordable throughput for the selected batch, crop, precision and evaluation path
    alternatives:
      - feasible run at useful comparison scale
      - memory or runtime failure hidden by nominal estimates
    discriminator: run a bounded canary at the intended configuration; measure peak memory and step time, verify data loading and evaluation overhead, then cost the matched campaign before launch
    primary_gate: a reproducible task comparison that fits the explicit memory redline and total campaign cap
    falsifier: if the canary or measured overhead invalidates the estimate, reduce or reallocate the plan before launching; a smaller feasible width is not itself a quality improvement
    sources:
      - "benchmark/manifest.json — July08, Aug30 and Sep14 provenance and packet hashes"
      - "benchmark/prompts/july08-baseline.md"
      - "benchmark/sealed/july08-baseline.md"
      - "benchmark/prompts/aug30-gopro-command.md"
      - "benchmark/sealed/aug30-gopro-command.md"
      - "benchmark/prompts/sep14-48h-budget.md"
      - "c833ef67-e14b-48d5-a384-c45e01a8d1c3"
      - "codex:01a05273-2670-7d51-a636-64470fed50d5:002348"

  - id: bundled-change-needs-component-control
    scope: compiler or architecture attribution / Aug02 DH9 example
    trigger: a new model changes both representation and input-dependent routing, then attributes its score difference to one component
    correction: a bundled change estimates the bundle's effect in the tested recipe; it does not identify which component contributed or whether their interaction mattered
    alternatives:
      - representation contribution
      - routing contribution
      - representation-routing interaction
      - initialization or resource difference
    discriminator: predeclare one component intervention while retaining the carrier, routing interface, trainable capacity, starting operator and training recipe as closely as feasible; inspect both the physical action and its routing-energy path
    primary_gate: a fixed-endpoint primary metric under a matched budget, with remaining mismatches recorded separately from mechanism attribution
    falsifier: if both components or their effective paths change, withdraw component-specific attribution; a loss of the tested control supports retaining the bundle locally without proving every component necessary
    sources:
      - "benchmark/manifest.json — aug02-compiler-ablation provenance and packet hashes"
      - "benchmark/prompts/aug02-compiler-ablation.md"
      - "benchmark/sealed/aug02-compiler-ablation.md"
      - "codex:019fc075-e3dd-7c50-aa90-16c85eb31d29:000176"
      - "codex:019fc09b-240c-7e73-94df-670d1b8dd6af:000418"

  - id: ablation-is-intervention-specific
    scope: structural necessity claims / Aug02 dictionary controls
    trigger: a replacement ablation is treated as equivalent to deletion, or one composite ablation is used to declare every removed element necessary
    correction: filling local slots with global coordinates, zeroing their actions, and deleting their slots are distinct interventions with distinct estimands
    alternatives:
      - tested replacement loses useful information
      - removal changes capacity or routing
      - only some components or their interaction matter
    discriminator: bind the executed arm to a precise intervention manifest; verify preserved slots, gains, action paths and routing inputs, and describe the conclusion for that exact arm
    primary_gate: matched endpoint and resource comparison for the executed intervention; reused development images support local model choice rather than generalization confirmation
    falsifier: if the executed arm differs from the planned control, revise the interpretation; failure of one replacement does not establish individual necessity or predict every other ablation
    sources:
      - "benchmark/manifest.json — aug02-compiler-ablation provenance and packet hashes"
      - "benchmark/prompts/aug02-compiler-ablation.md"
      - "benchmark/sealed/aug02-compiler-ablation.md"
      - "codex:019fcf6a-5859-76b1-a608-248dbc0d8bd7:002756"
      - "codex:019fd155-bfe5-7920-b4ac-ff0e403a7a2e:001368"
      - "codex:019fd155-bfe5-7920-b4ac-ff0e403a7a2e:012507"

  - id: transfer-requires-matched-protocol
    scope: cross-dataset mixer comparison / Aug30 GoPro example
    trigger: a small-dataset signal or unmatched old run is promoted to a cross-task method win
    correction: transfer is a new empirical question; the official carrier, data conventions, evaluation path and credible controls must be audited for the target task
    alternatives:
      - operator effect survives the target-task protocol
      - earlier gain depended on dataset or recipe
      - apparent gain comes from an unmatched comparison
    discriminator: execute the requested task pivot with a costed matched comparison; fix carrier, endpoints and evaluation, include a strong relevant comparator, and use paired seeds when the gain and available budget justify them
    primary_gate: target-task primary metric and paired uncertainty at the declared resource budget, with every completed arm and artifact identity recorded
    falsifier: if the gain disappears against the matched target-task control, retract the transfer claim for that recipe; do not infer failure on all tasks from one target-task result
    sources:
      - "benchmark/manifest.json — aug30-gopro-command provenance and packet hashes"
      - "benchmark/prompts/aug30-gopro-command.md"
      - "benchmark/sealed/aug30-gopro-command.md"
      - "codex:01a05273-2670-7d51-a636-64470fed50d5:000348"
      - "codex:01a05273-2670-7d51-a636-64470fed50d5:004469"

  - id: protocol-versioned-evidence
    scope: historical score comparison / evolving model and evaluation protocols
    trigger: scores from different model versions, tiling rules, checkpoints or evaluation recipes are merged into one comparative result
    correction: a task name and metric label do not identify an experiment; early halo-tiling and later full-image results cannot be exchanged without a matched replay
    alternatives:
      - reproducible difference under one protocol
      - score difference due to protocol or model drift
    discriminator: bind each table row to dataset hash, model and checkpoint identity, seed, training budget, endpoint selection and evaluation settings; compare like versions or explicitly rerun the required matched contrast
    primary_gate: a primary-metric table with auditable protocol identity and comparators evaluated by the same rule
    falsifier: if provenance cannot reconcile the rows, withhold the comparative claim rather than choosing the larger historical score
    sources:
      - "benchmark/manifest.json — aug30-gopro-command provenance and packet hashes"
      - "benchmark/prompts/aug30-gopro-command.md"
      - "benchmark/sealed/aug30-gopro-command.md"
      - "codex:01a05273-2670-7d51-a636-64470fed50d5:004469"
      - "codex:01a05b11-1356-7112-b489-17f64ae41ac0:001069"

  - id: normalization-removal-confound
    scope: amplitude constraints and optimization / Sep13 C7 example
    trigger: removing normalization harms quality and is offered as proof that a strict subunit boundary is necessary
    correction: deletion changes coefficient amplitude, the initial operator and gradients together; it tests the whole normalized design against the unprojected design
    alternatives:
      - ordinary amplitude control helps
      - a strict subunit boundary contributes
      - changed initialization or optimization explains the loss
    discriminator: retain normalization and match the starting operator and training recipe while varying the claimed boundary; measure realized amplitude and optimization differences rather than treating the knob value as the intervention
    primary_gate: matched task quality plus a verified boundary manipulation; task utility and strict-bound attribution are separate conclusions
    falsifier: if the comparator changes amplitude or optimization without identifying the boundary effect, retain only the narrower controlled-amplitude conclusion
    sources:
      - "benchmark/manifest.json — sep13-c7-boundary provenance and packet hashes"
      - "benchmark/prompts/sep13-c7-boundary.md"
      - "benchmark/sealed/sep13-c7-boundary.md"
      - "codex:01a042a0-1d63-7673-a07f-3f3f0a51bcee:006524"
      - "codex:01a084bf-fc89-73d3-a405-4d0b0e16da43:001633"

  - id: executed-manipulation-validity
    executable: {"decisions":["mechanism-attribution"],"preconditions":[{"fact":"mechanism_claim","op":"eq","value":true,"query":"Read the locked question and latest decision: is a primary gain being attributed to a specific mechanism?"}],"satisfied_when":[{"fact":"actual_predicate_changed","op":"eq","value":true,"query":"Read the executed intervention manifest and measured route activity/crossings: did the intended property change?","on_false":{"id":"narrow-unexecuted-manipulation","kind":"INTERPRETATION_UPDATE","description":"Mark the mechanism comparison untested; inspect actual route/crossing logs before redesigning.","competing_explanations":["intended property unchanged","code/log identity mismatch"],"required_observables":["executed manifest","actual predicate","source identity"],"outcomes":[{"observation":"intended property unchanged","next_decision":"narrow interpretation and redesign intervention"},{"observation":"evidence identity mismatch","next_decision":"repair binding before new comparison"}],"stop_condition":"Reuse existing artifacts first; stop on invalid prerequisites or the declared budget cap."}}],"action":{"id":"inspect-realized-manipulation","kind":"READ_ONLY_CHECK","description":"Inspect existing intervention measurements; a knob label is not actual manipulation.","competing_explanations":["intended property physically changed","another property changed or no manipulation occurred"],"required_observables":["intervention manifest","actual predicate values","executed identity"],"outcomes":[{"observation":"intended property changed","next_decision":"consider matched task comparison"},{"observation":"intended property unchanged","next_decision":"mark mechanism untested and revise intervention"}],"stop_condition":"Reuse existing artifacts first; stop on invalid prerequisites or the declared budget cap."}}
    scope: general / threshold and mechanism interventions
    trigger: a treatment is admitted or interpreted as testing a property without showing that its executed values can and do change that property
    correction: declared intervention labels and permissive parameter ranges are not manipulation checks; a same-side treatment cannot discriminate a threshold proposition
    alternatives:
      - the intervention changes the claimed property
      - the intervention is infeasible or unresponsive
      - the intervention changes a different property
    discriminator: derive the attainable range from the executed equation before expensive training, then log actual crossings or route activity on the committed data; keep feasibility, realized intervention and task outcome as separate checks
    primary_gate: the declared property must actually be manipulated before mechanism attribution; task quality still uses the predeclared matched metric and budget
    falsifier: absent realized manipulation, mark the mechanism untested; a valid counterexample within the declared domain refutes that necessity claim without proving a universal alternative
    sources:
      - "benchmark/manifest.json — sep13-c7-boundary provenance and packet hashes"
      - "benchmark/prompts/sep13-c7-boundary.md"
      - "benchmark/sealed/sep13-c7-boundary.md — source-aware intervention audit"
      - "codex:01a03d28-4c3b-70a0-94f0-d4396cde19b6:000244"
      - "scripts/rds_probe.py — admission_probe and observed boundary checks"

  - id: learned-support-not-allowed-support
    scope: learned constraints / Sep13 learnable-scaling example
    trigger: a learned parameter is allowed to cross a boundary and a quality gain is credited to crossing without inspecting the fitted values
    correction: the allowed parameter domain and the realized learned support are different; a gain confined to the original regime supports adaptation within that regime
    alternatives:
      - adaptation within the original constrained regime helps
      - realized boundary crossing helps
      - initialization or optimization accounts for the gain
    discriminator: inspect the executed effective operator and fitted parameter range across the declared data; compare matched fixed and learned controls and report boundary activity alongside quality
    primary_gate: primary metric for utility and observed effective-property crossings for the boundary claim, under the same recipe and selection rule
    falsifier: if no fitted effective operator crosses the boundary, withdraw any claim that crossing helped or that the boundary is unnecessary; parameter inspection must be repeated when the implementation changes
    sources:
      - "benchmark/manifest.json — sep13-c7-boundary provenance and packet hashes"
      - "benchmark/prompts/sep13-c7-boundary.md"
      - "benchmark/sealed/sep13-c7-boundary.md"
