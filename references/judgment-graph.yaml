      "id": "realized-boundary-not-knob",
      "scope": "NSI-style row normalization a_i = rho * raw_i / (1 + sum_j abs(raw_j)); recompute for any changed implementation",
      "trigger": "a change of the rho parameter is claimed to test whether actual row mass below one is necessary",
      "correction": "actual mass m = rho * S / (1 + S), S = sum_j abs(raw_j); for finite S and rho = 1, m is still strictly below one",
      "alternatives": [
        "a tighter 0.95 safety margin helps",
        "strict subunit mass is necessary",
        "ordinary amplitude control or optimization explains the result"
      ],
      "discriminator": "to test the strict subunit predicate, use a normalized comparator that can realize m at or above one, measure actual crossings, and match starting operator and training as closely as feasible; a 0.95 versus 1.00 cap tests only the margin; for rho > 1 the original formula crosses only when S >= 1 / (rho - 1)",
      "primary_gate": "matched restoration metric and budget; separate any task gain from the narrower mechanism conclusion",
      "falsifier": "if the executed operator differs from this formula, recalculate its attainable mass; if no actual crossing occurs, withdraw any strict-bound inference",
      "sources": [
        "benchmark/prompts/sep13-c7-boundary.md",
        "benchmark/sealed/sep13-c7-boundary.md — source-aware intervention audit",
        "codex:01a03d28-4c3b-70a0-94f0-d4396cde19b6:000244"
      ],
      "proof_obligations": {
        "schema": 1,
        "preconditions": [
          "Bind the executed normalization equation, finite domain and rho>=0 under exact real/rational semantics.",
          "Match initialization and recipe, and measure actual effective mass; audit floating-point differences separately."
        ],
        "feasible_domain": {
          "expression": "S=sum_j abs(raw_j)>=0; rho>=0; m=rho*S/(1+S); rho=1 and finite S implies m<1; rho>1 implies (m>=1 iff S>=1/(rho-1))",
          "variables": "raw_j: actual row coefficients; S: their finite absolute sum; rho: finite declared scaling; m: executed effective row mass",
          "assumptions": [
            "Use the node scope and bind declared inputs to original artifacts.",
            "These are documentation predicates; no automatic parser or proof is implied."
          ]
        },
        "falsifier": "The source uses a different equation or no executed mass reaches the claimed boundary; withdraw strict-bound inference.",
        "evidence_requirements": [
          "to test the strict subunit predicate, use a normalized comparator that can realize m at or above one, measure actual crossings, and match starting operator and training as closely as feasible; a 0.95 versus 1.00 cap tests only the margin; for rho > 1 the original formula crosses only when S >= 1 / (rho - 1)",
          "matched restoration metric and budget; separate any task gain from the narrower mechanism conclusion",
          "Preserve original source identities, versions and actual outputs; do not substitute self-signed success fields."
        ],
        "verification": {
