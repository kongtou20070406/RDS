  - id: adaptive-test-reuse
    scope: adaptive model, schedule and budget selection / Sep14 example
    trigger: viewed test outcomes determine a new architecture, endpoint or resource allocation, and the same test is called untouched confirmation afterward
    correction: adaptive reuse can produce useful exploration and a measured score, but it does not erase selection information or restore an independent final test
    alternatives:
      - productive exploratory gain on the exposed partition
      - a gain that survives independent precommitted confirmation
    discriminator: log the exposure and every decision it influenced; freeze the selected candidate and evaluation rule before testing once on a genuinely unexposed cohort, or explicitly limit the claim to exploratory performance
    primary_gate: independent confirmation for a confirmatory gain claim; the exposed test remains a valid measured exploratory endpoint under its stated protocol
    falsifier: if the confirmation cohort or overlapping lineage was previously exposed, retract the independent-confirmation label; do not discard the exploratory score merely because its selection was adaptive
    sources:
      - "benchmark/manifest.json — sep14-48h-budget provenance and packet hashes"
      - "benchmark/prompts/sep14-48h-budget.md"
      - "benchmark/sealed/sep14-48h-budget.md"
