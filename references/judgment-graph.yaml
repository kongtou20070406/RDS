    {
      "id": "locked-test-selection",
      "scope": "general",
      "trigger": "a checkpoint, model, or hyperparameter is chosen after seeing the same reported test scores",
      "correction": "selection on a finite test set can make the apparent winner optimistic",
      "alternatives": [
        "real method gain",
        "selection noise"
      ],
      "discriminator": "predeclare checkpoint selection on development data; confirm the chosen model once on untouched test data",
      "primary_gate": "project locked test metric and fair baseline, with every candidate and selection decision logged",
      "falsifier": "if fresh test gain vanishes, retract the strong gain claim; do not infer the method can never work",
      "sources": [
        "https://www.jmlr.org/papers/v11/cawley10a.html"
      ],
      "proof_obligations": {
        "schema": 1,
        "preconditions": [
          "Record all candidate selection and exposure before confirmation.",
          "Bind the same evaluator, baseline and predeclared useful delta."
        ],
        "feasible_domain": {
          "expression": "clean(T) and selection_data intersect T = empty; Delta_T = s*(M_T(treatment)-M_T(control))",
          "variables": "T: frozen confirmation cohort; selection_data: all samples or linked cohorts influencing selection; clean: recorded unexposed lineage; M_T: predeclared metric; s: +1 maximize, -1 minimize",
          "assumptions": [
            "Use the node scope and bind declared inputs to original artifacts.",
            "These are documentation predicates; no automatic parser or proof is implied."
          ]
        },
        "falsifier": "The frozen independent comparison does not support the predeclared useful gain, or confirmation lineage was already exposed.",
        "evidence_requirements": [
          "predeclare checkpoint selection on development data; confirm the chosen model once on untouched test data",
          "project locked test metric and fair baseline, with every candidate and selection decision logged",
          "Preserve original source identities, versions and actual outputs; do not substitute self-signed success fields."
        ],
        "verification": {
          "mode": "protocol_and_empirical",
          "registry_rule_id": "locked-test-selection",
          "entrypoint": {
            "kind": "causal_rule",
            "rule_id": "locked-test-selection"
          },
